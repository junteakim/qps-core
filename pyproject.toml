[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qps-core"
version = "0.3.0"
description = "Auditable workflow kernel for high-mix, low-volume production"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pyshacl>=0.30,<1",
  "rdflib>=7,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
qps-core = "qps_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qps_core = ["resources/*.json", "resources/*.ttl"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
